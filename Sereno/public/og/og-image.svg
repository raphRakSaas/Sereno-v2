<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Sereno  Gère ton budget en toute sérénité">
  <defs>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF8F6"/>
  <rect width="1200" height="630" fill="url(#accentGlow)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="90" r="180" fill="#FF4D6D" fill-opacity="0.06"/>
  <circle cx="150" cy="560" r="120" fill="#FF4D6D" fill-opacity="0.05"/>

  <!-- Bento card preview -->
  <rect x="720" y="120" width="380" height="390" rx="20" fill="url(#cardShine)" stroke="#E8E4E0" stroke-width="2"/>
  <rect x="750" y="155" width="140" height="12" rx="6" fill="#E8E4E0"/>
  <rect x="750" y="185" width="220" height="28" rx="8" fill="#171412" fill-opacity="0.9"/>
  <rect x="750" y="230" width="100" height="10" rx="5" fill="#6B635C" fill-opacity="0.5"/>

  <rect x="750" y="280" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#E8E4E0" stroke-width="1.5"/>
  <rect x="770" y="300" width="80" height="10" rx="5" fill="#6B635C" fill-opacity="0.4"/>
  <rect x="770" y="322" width="140" height="14" rx="7" fill="#171412" fill-opacity="0.85"/>
  <rect x="980" y="308" width="70" height="16" rx="8" fill="#17836B" fill-opacity="0.15"/>
  <rect x="990" y="312" width="50" height="8" rx="4" fill="#17836B"/>

  <rect x="750" y="370" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#E8E4E0" stroke-width="1.5"/>
  <rect x="770" y="390" width="90" height="10" rx="5" fill="#6B635C" fill-opacity="0.4"/>
  <rect x="770" y="412" width="120" height="14" rx="7" fill="#171412" fill-opacity="0.85"/>
  <rect x="750" y="460" width="320" height="8" rx="4" fill="#E8E4E0"/>
  <rect x="750" y="460" width="210" height="8" rx="4" fill="#FF4D6D"/>

  <!-- Logo mark -->
  <g transform="translate(96, 200)">
    <path d="M14 30.5C14 20.8 22.1 13 32 13C41.9 13 50 20.8 50 30.5" stroke="#FF4D6D" stroke-width="5" stroke-linecap="round" transform="scale(2.8)"/>
    <path d="M10.5 46.5L32 30.5L53.5 46.5" fill="#FF4D6D" transform="scale(2.8)"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="600" fill="#171412" letter-spacing="-1">sereno</text>

  <!-- Tagline -->
  <text x="96" y="400" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500" fill="#6B635C">Gère ton budget en toute sérénité.</text>
  <text x="96" y="440" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400" fill="#6B635C" fill-opacity="0.8">Simple, local, sans jugement.</text>

  <!-- Accent pill -->
  <rect x="96" y="480" width="280" height="44" rx="10" fill="#FF4D6D"/>
  <text x="236" y="509" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Découvrir Sereno</text>
</svg>
